; Talo telemetry configuration TEMPLATE.
;
; Copy to `addons/talo/settings.cfg` (gitignored) and fill in access_key.
;
; READ THIS BEFORE CHANGING ANY VALUE HERE
;
; settings.cfg is gitignored because it carries a plaintext access key, BUT
; addons/talo/talo_export.gd:7-8 force-includes it into every export via
; add_file(). So this file is untracked and always shipped: whatever sits on the
; packaging machine is what reaches testers, with nothing in git recording the
; choice. `scripts/lint_talo_config.py` is the tracked guard. Run it before any
; build that goes to another human.
;
; The two false values below are load-bearing, not preferences:
;
;   auto_connect_socket=false
;     talo_socket.open_connection() fires from Talo._ready() and does an HTTPS
;     POST to mint a socket ticket (authenticated with the access key) followed
;     by a WSS connect. That is an outbound connection to a third-party analytics
;     host, carrying the tester's IP, BEFORE the consent screen has been shown.
;     Nothing in src/ uses the socket: the project touches only Talo.events and
;     Talo.players, and events_api.track() queues over HTTP. So leaving this on
;     buys nothing and costs both a privacy exposure and 300-2000ms of cold-start
;     latency on a mobile radio.
;
;   auto_start_session=false
;     player_auth.start_session() calls Talo.players.identify("talo", ...) for a
;     restored session. TaloAnalyticsAdapter owns identity in this project, using
;     its own anonymous per-install ID and identifying ONLY after
;     LegalConsentManager.get_analytics_consent() returns true. Leaving this on
;     gives Talo a second, competing identity path that bypasses that gate.
;
; What is already correct and needs no config: the event path. The adapter checks
; consent in _on_analytics_event(), and events_api.track() early-returns unless
; identity_check() == OK. No gameplay or player data leaves the device without
; consent.
;
; STILL OPEN, decide before any public release: access_key below is a plaintext
; JWT and this file ships inside the APK, so it is extractable by anyone who
; downloads the build. Same class of exposure as the Discord webhook in
; support_config.cfg. Acceptable for a 10-20 person closed alpha; revisit for EA.

access_key="<your Talo access key>"
api_url="https://api.trytalo.com"
socket_url="wss://api.trytalo.com"
auto_connect_socket=false
handle_tree_quit=true
cache_player_on_identify=true
debounce_timer_seconds=1.0

[continuity]

enabled=true

[player_auth]

auto_start_session=false

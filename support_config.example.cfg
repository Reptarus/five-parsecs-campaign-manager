; Project-local secrets. Copy this to `support_config.cfg` (gitignored) and
; fill in the value. Godot reads it with ConfigFile from res://.
;
; WHY .cfg AND NOT .env.local: Godot only packs non-resource files into an
; export if they match the preset's include_filter. The Android preset's filter
; is "*.tscn, *.json, *.gd, *.tres, *.cfg, *.md, *.txt" — a file named
; `.env.local` matches none of those, so it would be MISSING from the APK and
; the webhook would silently never fire on device while working fine on desktop.
; `.cfg` matches, and mirrors the existing `addons/talo/settings.cfg` pattern.

[discord]

; Where in-app bug reports from alpha testers are posted.
;
; USE A DEDICATED WEBHOOK POINTED AT A PRIVATE CHANNEL.
;
; Unlike the After Midnight Tavern storefront — which posts server-side from a
; Cloudflare Worker, where the URL never leaves the server — this app SHIPS TO
; TESTERS. Any webhook URL compiled into the build is extractable from the APK,
; and whoever extracts it can post arbitrary content to that channel.
;
; So: create a webhook used ONLY for this, in a private #alpha-bugs channel.
; If it ever leaks you delete that one webhook and nothing else is affected.
; Never reuse the storefront ORDERS / BAN_ALERTS / RESTOCK / PRICE_ALERTS hooks.
;
; Leave this unset and the reporter still works: the report saves to
; user://bug_reports/ and goes to the tester's clipboard, it just does not post.
bug_reports_webhook="https://discord.com/api/webhooks/..."
